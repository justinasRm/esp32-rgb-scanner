<!doctype html>
<html lang="en">
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>XIAO ESP32S3 camera</title>
	<style>
		body {
			font: 16px system-ui, sans-serif;
			background: #14202b;
			color: white;
			margin: 24px auto;
			max-width: 1000px;
			padding: 0 16px;
		}
		img {
			display: block;
			width: 100%;
			height: auto;
			background: black;
			border-radius: 8px;
		}
	</style>
	<h1>XIAO ESP32S3 Sense camera</h1>
	<p id="status">Waiting for camera…</p>
	<img id="camera" alt="Live camera feed" />
	<script>
		const camera = document.getElementById("camera");
		const status = document.getElementById("status");
		camera.onload = () => {
			status.textContent = `${camera.naturalWidth} × ${camera.naturalHeight}`;
		};
		camera.onerror = () => {
			status.textContent = "Waiting for camera…";
		};
		function update() {
			camera.src = `/capture?t=${Date.now()}`;
			setTimeout(update, 1000);
		}
		update();
	</script>
</html>
